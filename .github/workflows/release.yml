name: Release

on:
  push:
    branches: 
      - master

permissions: 
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release_please.outputs.releases_created }}
      paths_released: ${{ steps.release_please.outputs.paths_released }}
      release_please_outputs: ${{ toJSON(steps.release_please.outputs) }}
    steps:
      - id: release_please
        name: Prepare release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          skip-github-pull-request: true

  release:
    name: Release
    needs: prepare_release
    if: needs.prepare_release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        path: ${{ fromJson(needs.prepare_release.outputs.paths_released) }}
    env:
      TARGET_PATH: ${{ matrix.path }}
      TAG_NAME: ${{ fromJSON(needs.prepare_release.outputs.release_please_outputs)[format('{0}--tag_name', matrix.path)] }}
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          require-lockfile: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x

      - name: Build userscript
        run: pnpm --filter='./${{ matrix.path }}' run build

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ env.TAG_NAME }}
          draft: true
          files: |
            ${{ matrix.path }}/dist/*.meta.js
            ${{ matrix.path }}/dist/*.user.js
          fail_on_unmatched_files: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG_NAME" --draft=false

      - name: Update releases branch
        run: |
          set -euo pipefail

          RELEASE_PATH="${TARGET_PATH##*/}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin refs/heads/releases:refs/remotes/origin/releases
          git switch --force-create releases --track origin/releases

          rm --force "$RELEASE_PATH/*.meta.js" "$RELEASE_PATH/*.user.js"
          cp "$TARGET_PATH/dist/*.meta.js" "$TARGET_PATH/dist/*.user.js" .

          git add -- "$RELEASE_PATH/*.meta.js" "$RELEASE_PATH/*.user.js"

          if ! git diff --cached --quiet; then
            git commit --message="chore(releases): release $TAG_NAME"
            git push origin releases
          else
            echo "No release to commit"
          fi

  draft_next_release:
    name: Draft next release
    needs:
      - prepare_release
      - release
    if: always() && (needs.prepare_release.result == 'success') && ((needs.release.result == 'success') || (needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Draft release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          skip-github-release: true
